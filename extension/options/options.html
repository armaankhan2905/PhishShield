<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhishShield settings</title>
<link rel="stylesheet" href="../popup/popup.css">
<style>
  body { width: auto; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  main { padding: 16px 0; gap: 14px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  legend { font-weight: 600; padding: 0 4px; }
  input[type=url], select { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
</style>
</head>
<body>
  <header><img src="../icons/icon32.png" alt="" width="20" height="20"><h1>PhishShield settings</h1></header>
  <main>
    <fieldset>
      <legend>Server</legend>
      <label for="apiBase">PhishShield server address</label>
      <input id="apiBase" type="url" placeholder="http://localhost:8000">
      <p class="hint">Local (http://localhost:8000): messages are analysed on this computer.
        Any other address: messages are sent to that server, and the browser asks you to allow it.</p>
      <div class="row"><button id="test" type="button">Test connection</button><span id="testResult" class="status" role="status"></span></div>
    </fieldset>

    <fieldset>
      <legend>Where to check</legend>
      <label class="check"><input id="gmail" type="checkbox"> Check emails I open in Gmail</label>
      <label for="linkScan">Highlight risky links on other websites</label>
      <select id="linkScan">
        <option value="auto">Automatic: only when the server is on this computer</option>
        <option value="on">On: always (links are sent to the server)</option>
        <option value="off">Off</option>
      </select>
      <label class="check"><input id="stopPage" type="checkbox"> Show a warning page before opening a risky link</label>
    </fieldset>

    <div class="row"><button id="save" type="button">Save</button><span id="saved" class="status" role="status"></span></div>
  </main>
  <script src="../shared/verdict.js"></script>
  <script src="options.js"></script>
</body>
</html>
